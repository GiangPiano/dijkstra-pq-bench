<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
<defs>
  <style>
    .axis { stroke: #CBD5E1; stroke-width: 1; }
    .grid { stroke: #F1F5F9; stroke-width: 1; stroke-dasharray: 4,4; }
    .tick-label { font-size: 11px; fill: #64748B; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #334155; }
    .chart-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .chart-subtitle { font-size: 12px; fill: #64748B; }
    .bar-label { font-size: 10px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
    .legend-text { font-size: 11px; fill: #334155; font-weight: 500; }
  </style>
</defs>
<text x="90" y="32" class="chart-title">Dijkstra Runtime Comparison: tiny_dense</text>
<text x="90" y="50" class="chart-subtitle">Wall-clock execution time across Priority Queue variants (lower is better)</text>
<line x1="90" y1="360.0" x2="680" y2="360.0" class="grid" />
<text x="80" y="364.0" class="tick-label" text-anchor="end">0.0 ns</text>
<line x1="90" y1="302.0" x2="680" y2="302.0" class="grid" />
<text x="80" y="306.0" class="tick-label" text-anchor="end">1.71 µs</text>
<line x1="90" y1="244.0" x2="680" y2="244.0" class="grid" />
<text x="80" y="248.0" class="tick-label" text-anchor="end">3.42 µs</text>
<line x1="90" y1="186.0" x2="680" y2="186.0" class="grid" />
<text x="80" y="190.0" class="tick-label" text-anchor="end">5.13 µs</text>
<line x1="90" y1="128.0" x2="680" y2="128.0" class="grid" />
<text x="80" y="132.0" class="tick-label" text-anchor="end">6.85 µs</text>
<line x1="90" y1="70.0" x2="680" y2="70.0" class="grid" />
<text x="80" y="74.0" class="tick-label" text-anchor="end">8.56 µs</text>
<line x1="90" y1="70" x2="90" y2="360" class="axis" />
<line x1="90" y1="360" x2="680" y2="360" class="axis" />
<text x="-215.0" y="20" class="axis-title" text-anchor="middle" transform="rotate(-90)">Mean Runtime</text>
<text x="237.5" y="385" class="axis-title" text-anchor="middle">Explicit Decrease-Key</text>
<rect x="167.5" y="243.6" width="32.0" height="116.4" fill="#2563EB" rx="3" ry="3"><title>binary (decrease_key): 3.43 µs</title></rect>
<text x="183.5" y="238.6" class="bar-label">3.43 µs</text>
<text x="219.5" y="350" class="bar-label" fill="#94A3B8">N/A</text>
<rect x="239.5" y="240.1" width="32.0" height="119.9" fill="#9333EA" rx="3" ry="3"><title>fibonacci (decrease_key): 3.54 µs</title></rect>
<text x="255.5" y="235.1" class="bar-label">3.54 µs</text>
<rect x="275.5" y="259.5" width="32.0" height="100.5" fill="#16A34A" rx="3" ry="3"><title>pairing (decrease_key): 2.96 µs</title></rect>
<text x="291.5" y="254.5" class="bar-label">2.96 µs</text>
<text x="532.5" y="385" class="axis-title" text-anchor="middle">Lazy Insertion</text>
<rect x="462.5" y="177.2" width="32.0" height="182.8" fill="#2563EB" rx="3" ry="3"><title>binary (lazy): 5.39 µs</title></rect>
<text x="478.5" y="172.2" class="bar-label">5.39 µs</text>
<text x="514.5" y="350" class="bar-label" fill="#94A3B8">N/A</text>
<rect x="534.5" y="107.8" width="32.0" height="252.2" fill="#9333EA" rx="3" ry="3"><title>fibonacci (lazy): 7.44 µs</title></rect>
<text x="550.5" y="102.8" class="bar-label">7.44 µs</text>
<rect x="570.5" y="194.0" width="32.0" height="166.0" fill="#16A34A" rx="3" ry="3"><title>pairing (lazy): 4.90 µs</title></rect>
<text x="586.5" y="189.0" class="bar-label">4.90 µs</text>
<rect x="260" y="20" width="12" height="12" fill="#2563EB" rx="2" />
<text x="276" y="30" class="legend-text">binary</text>
<rect x="365" y="20" width="12" height="12" fill="#EA580C" rx="2" />
<text x="381" y="30" class="legend-text">brodal-okasaki</text>
<rect x="470" y="20" width="12" height="12" fill="#9333EA" rx="2" />
<text x="486" y="30" class="legend-text">fibonacci</text>
<rect x="575" y="20" width="12" height="12" fill="#16A34A" rx="2" />
<text x="591" y="30" class="legend-text">pairing</text>
</svg>