<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
<defs>
  <style>
    .axis { stroke: #CBD5E1; stroke-width: 1; }
    .grid { stroke: #F1F5F9; stroke-width: 1; stroke-dasharray: 4,4; }
    .baseline { stroke: #EF4444; stroke-width: 1.5; stroke-dasharray: 3,3; }
    .tick-label { font-size: 11px; fill: #64748B; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #334155; }
    .chart-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .chart-subtitle { font-size: 12px; fill: #64748B; }
    .bar-label { font-size: 10px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
    .legend-text { font-size: 12px; fill: #334155; font-weight: 500; dominant-baseline: central; }
  </style>
</defs>
<text x="80" y="32" class="chart-title">Speedup Ratio: Lazy vs. Decrease-Key</text>
<text x="80" y="50" class="chart-subtitle">T(lazy) / T(decrease-key) &gt; 1.0 means Decrease-Key is faster; &lt; 1.0 means Lazy is faster</text>
<line x1="80" y1="270.0" x2="680" y2="270.0" class="baseline" />
<text x="685" y="274.0" class="tick-label" fill="#EF4444" font-weight="600">1.0x (Parity)</text>
<line x1="80" y1="320.0" x2="680" y2="320.0" class="grid" />
<text x="70" y="324.0" class="tick-label" text-anchor="end">0.5x</text>
<line x1="80" y1="270.0" x2="680" y2="270.0" class="grid" />
<text x="70" y="274.0" class="tick-label" text-anchor="end">1.0x</text>
<line x1="80" y1="220.0" x2="680" y2="220.0" class="grid" />
<text x="70" y="224.0" class="tick-label" text-anchor="end">1.5x</text>
<line x1="80" y1="170.0" x2="680" y2="170.0" class="grid" />
<text x="70" y="174.0" class="tick-label" text-anchor="end">2.0x</text>
<line x1="80" y1="120.0" x2="680" y2="120.0" class="grid" />
<text x="70" y="124.0" class="tick-label" text-anchor="end">2.5x</text>
