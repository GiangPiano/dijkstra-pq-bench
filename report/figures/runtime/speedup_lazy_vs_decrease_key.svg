<text x="70" y="74.0" class="tick-label" text-anchor="end">3.0x</text>
<line x1="80" y1="70" x2="80" y2="370" class="axis" />
<line x1="80" y1="370" x2="680" y2="370" class="axis" />
<text x="-220.0" y="20" class="axis-title" text-anchor="middle" transform="rotate(-90)">Speedup Factor</text>
<text x="155.0" y="395" class="axis-title" text-anchor="middle">tiny_dense</text>
<rect x="100.8" y="213.0" width="24.1" height="157.0" fill="#2563EB" rx="3" ry="3"><title>binary on tiny_dense: 1.57x</title></rect>
