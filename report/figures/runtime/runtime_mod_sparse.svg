<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
<defs>
  <style>
    .axis { stroke: #CBD5E1; stroke-width: 1; }
    .grid { stroke: #F1F5F9; stroke-width: 1; stroke-dasharray: 4,4; }
    .tick-label { font-size: 11px; fill: #64748B; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #334155; }
    .chart-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .chart-subtitle { font-size: 12px; fill: #64748B; }
    .bar-label { font-size: 10px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
    .legend-text { font-size: 12px; fill: #334155; font-weight: 500; dominant-baseline: central; }
  </style>
</defs>
<text x="90" y="32" class="chart-title">Dijkstra Runtime Comparison: mod_sparse</text>
<text x="90" y="50" class="chart-subtitle">Wall-clock execution time across Priority Queue variants (lower is better)</text>
<line x1="90" y1="370.0" x2="680" y2="370.0" class="grid" />
<text x="80" y="374.0" class="tick-label" text-anchor="end">0.0 ns</text>
<line x1="90" y1="310.0" x2="680" y2="310.0" class="grid" />
<text x="80" y="314.0" class="tick-label" text-anchor="end">10.79 ms</text>
<line x1="90" y1="250.0" x2="680" y2="250.0" class="grid" />
<text x="80" y="254.0" class="tick-label" text-anchor="end">21.59 ms</text>
<line x1="90" y1="190.0" x2="680" y2="190.0" class="grid" />
<text x="80" y="194.0" class="tick-label" text-anchor="end">32.38 ms</text>
<line x1="90" y1="130.0" x2="680" y2="130.0" class="grid" />
<text x="80" y="134.0" class="tick-label" text-anchor="end">43.17 ms</text>
<line x1="90" y1="70.0" x2="680" y2="70.0" class="grid" />
<text x="80" y="74.0" class="tick-label" text-anchor="end">53.96 ms</text>
<line x1="90" y1="70" x2="90" y2="370" class="axis" />
<line x1="90" y1="370" x2="680" y2="370" class="axis" />
<text x="-220.0" y="20" class="axis-title" text-anchor="middle" transform="rotate(-90)">Mean Runtime</text>
<text x="237.5" y="395" class="axis-title" text-anchor="middle">Explicit Decrease-Key</text>
<rect x="167.5" y="177.9" width="32.0" height="192.1" fill="#2563EB" rx="3" ry="3"><title>binary (decrease_key): 34.55 ms</title></rect>
<text x="183.5" y="172.9" class="bar-label">34.55 ms</text>
<text x="219.5" y="360" class="bar-label" fill="#94A3B8">N/A</text>
<rect x="239.5" y="152.8" width="32.0" height="217.2" fill="#9333EA" rx="3" ry="3"><title>fibonacci (decrease_key): 39.06 ms</title></rect>
<text x="255.5" y="147.8" class="bar-label">39.06 ms</text>
<rect x="275.5" y="232.8" width="32.0" height="137.2" fill="#16A34A" rx="3" ry="3"><title>pairing (decrease_key): 24.68 ms</title></rect>
<text x="291.5" y="227.8" class="bar-label">24.68 ms</text>
<text x="532.5" y="395" class="axis-title" text-anchor="middle">Lazy Insertion</text>
<rect x="462.5" y="139.5" width="32.0" height="230.5" fill="#2563EB" rx="3" ry="3"><title>binary (lazy): 41.46 ms</title></rect>
<text x="478.5" y="134.5" class="bar-label">41.46 ms</text>
<text x="514.5" y="360" class="bar-label" fill="#94A3B8">N/A</text>
<rect x="534.5" y="109.1" width="32.0" height="260.9" fill="#9333EA" rx="3" ry="3"><title>fibonacci (lazy): 46.92 ms</title></rect>
<text x="550.5" y="104.1" class="bar-label">46.92 ms</text>
<rect x="570.5" y="206.2" width="32.0" height="163.8" fill="#16A34A" rx="3" ry="3"><title>pairing (lazy): 29.46 ms</title></rect>
<text x="586.5" y="201.2" class="bar-label">29.46 ms</text>
<rect x="90.0" y="421.0" width="14" height="14" fill="#2563EB" rx="3" ry="3" />
<text x="110.0" y="428.0" class="legend-text">binary</text>
<rect x="230.0" y="421.0" width="14" height="14" fill="#EA580C" rx="3" ry="3" />
<text x="250.0" y="428.0" class="legend-text">brodal-okasaki</text>
<rect x="370.0" y="421.0" width="14" height="14" fill="#9333EA" rx="3" ry="3" />
<text x="390.0" y="428.0" class="legend-text">fibonacci</text>
<rect x="510.0" y="421.0" width="14" height="14" fill="#16A34A" rx="3" ry="3" />
<text x="530.0" y="428.0" class="legend-text">pairing</text>
</svg>