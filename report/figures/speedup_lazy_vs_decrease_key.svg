<rect x="335.1" y="201.1" width="24.1" height="138.9" fill="#16A34A" rx="3" ry="3"><title>pairing on small_med: 1.54x</title></rect>
<text x="347.2" y="196.1" class="bar-label">1.54x</text>
<text x="455.0" y="365" class="axis-title" text-anchor="middle">mod_sparse</text>
<rect x="400.8" y="232.0" width="24.1" height="108.0" fill="#2563EB" rx="3" ry="3"><title>binary on mod_sparse: 1.20x</title></rect>
<text x="412.8" y="227.0" class="bar-label">1.20x</text>
<rect x="457.0" y="231.9" width="24.1" height="108.1" fill="#9333EA" rx="3" ry="3"><title>fibonacci on mod_sparse: 1.20x</title></rect>
<text x="469.1" y="226.9" class="bar-label">1.20x</text>
<rect x="485.1" y="232.6" width="24.1" height="107.4" fill="#16A34A" rx="3" ry="3"><title>pairing on mod_sparse: 1.19x</title></rect>
<text x="497.2" y="227.6" class="bar-label">1.19x</text>
<text x="605.0" y="365" class="axis-title" text-anchor="middle">big_sparse</text>
<rect x="550.8" y="232.3" width="24.1" height="107.7" fill="#2563EB" rx="3" ry="3"><title>binary on big_sparse: 1.20x</title></rect>
<text x="562.8" y="227.3" class="bar-label">1.20x</text>
<rect x="607.0" y="228.6" width="24.1" height="111.4" fill="#9333EA" rx="3" ry="3"><title>fibonacci on big_sparse: 1.24x</title></rect>
<text x="619.1" y="223.6" class="bar-label">1.24x</text>
<rect x="635.1" y="223.3" width="24.1" height="116.7" fill="#16A34A" rx="3" ry="3"><title>pairing on big_sparse: 1.30x</title></rect>
<text x="647.2" y="218.3" class="bar-label">1.30x</text>
<rect x="260" y="20" width="12" height="12" fill="#2563EB" rx="2" />
<text x="276" y="30" class="legend-text">binary</text>
<rect x="365" y="20" width="12" height="12" fill="#EA580C" rx="2" />
<text x="381" y="30" class="legend-text">brodal-okasaki</text>
<rect x="470" y="20" width="12" height="12" fill="#9333EA" rx="2" />
<text x="486" y="30" class="legend-text">fibonacci</text>
<rect x="575" y="20" width="12" height="12" fill="#16A34A" rx="2" />
<text x="591" y="30" class="legend-text">pairing</text>
</svg>