<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
<defs>
  <style>
    .axis { stroke: #CBD5E1; stroke-width: 1; }
    .grid { stroke: #F1F5F9; stroke-width: 1; stroke-dasharray: 4,4; }
    .baseline { stroke: #EF4444; stroke-width: 1.5; stroke-dasharray: 3,3; }
    .tick-label { font-size: 11px; fill: #64748B; }
    .axis-title { font-size: 12px; font-weight: 600; fill: #334155; }
    .chart-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .chart-subtitle { font-size: 12px; fill: #64748B; }
    .bar-label { font-size: 10px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
    .legend-text { font-size: 11px; fill: #334155; font-weight: 500; }
  </style>
</defs>
<text x="80" y="32" class="chart-title">Speedup Ratio: Lazy vs. Decrease-Key</text>
<text x="80" y="50" class="chart-subtitle">T(lazy) / T(decrease-key) &gt; 1.0 means Decrease-Key is faster; &lt; 1.0 means Lazy is faster</text>
<line x1="80" y1="250.0" x2="680" y2="250.0" class="baseline" />
<text x="685" y="254.0" class="tick-label" fill="#EF4444" font-weight="600">1.0x (Parity)</text>
<line x1="80" y1="295.0" x2="680" y2="295.0" class="grid" />
<text x="70" y="299.0" class="tick-label" text-anchor="end">0.5x</text>
<line x1="80" y1="250.0" x2="680" y2="250.0" class="grid" />
<text x="70" y="254.0" class="tick-label" text-anchor="end">1.0x</text>
<line x1="80" y1="205.0" x2="680" y2="205.0" class="grid" />
<text x="70" y="209.0" class="tick-label" text-anchor="end">1.5x</text>
<line x1="80" y1="160.0" x2="680" y2="160.0" class="grid" />
<text x="70" y="164.0" class="tick-label" text-anchor="end">2.0x</text>
<line x1="80" y1="115.0" x2="680" y2="115.0" class="grid" />
<text x="70" y="119.0" class="tick-label" text-anchor="end">2.5x</text>
<line x1="80" y1="70.0" x2="680" y2="70.0" class="grid" />
<text x="70" y="74.0" class="tick-label" text-anchor="end">3.0x</text>
<line x1="80" y1="70" x2="80" y2="340" class="axis" />
<line x1="80" y1="340" x2="680" y2="340" class="axis" />
<text x="-205.0" y="20" class="axis-title" text-anchor="middle" transform="rotate(-90)">Speedup Factor</text>
<text x="155.0" y="365" class="axis-title" text-anchor="middle">tiny_dense</text>
<rect x="100.8" y="198.7" width="24.1" height="141.3" fill="#2563EB" rx="3" ry="3"><title>binary on tiny_dense: 1.57x</title></rect>
<text x="112.8" y="193.7" class="bar-label">1.57x</text>
<rect x="157.0" y="150.7" width="24.1" height="189.3" fill="#9333EA" rx="3" ry="3"><title>fibonacci on tiny_dense: 2.10x</title></rect>
<text x="169.1" y="145.7" class="bar-label">2.10x</text>
<rect x="185.1" y="191.3" width="24.1" height="148.7" fill="#16A34A" rx="3" ry="3"><title>pairing on tiny_dense: 1.65x</title></rect>
<text x="197.2" y="186.3" class="bar-label">1.65x</text>
<text x="305.0" y="365" class="axis-title" text-anchor="middle">small_med</text>
<rect x="250.8" y="178.1" width="24.1" height="161.9" fill="#2563EB" rx="3" ry="3"><title>binary on small_med: 1.80x</title></rect>
<text x="262.8" y="173.1" class="bar-label">1.80x</text>
<rect x="278.9" y="312.0" width="24.1" height="28.0" fill="#EA580C" rx="3" ry="3"><title>brodal-okasaki on small_med: 0.31x</title></rect>
<text x="290.9" y="307.0" class="bar-label">0.31x</text>
<rect x="307.0" y="155.9" width="24.1" height="184.1" fill="#9333EA" rx="3" ry="3"><title>fibonacci on small_med: 2.05x</title></rect>
